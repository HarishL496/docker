apiVersion: apps/v1
kind: Deployment
metadata:
  name: temp-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temp-converter
  template:
    metadata:
      labels:
        app: temp-converter
    spec:
      containers:
      - name: temp-converter
        image: DOCKERHUB_USERNAME/temp-converter:IMAGE_TAG
        ports:
        - containerPort: 5000
